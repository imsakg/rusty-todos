[package]
name = "rusty_todos"
version = "0.0.1"
edition = "2021"
default-run = "rusty-todos"

[features]
default = []
server = ["dep:tokio", "dep:futures", "dep:warp", "dep:sqlx", "dep:sqlb"]
postgres-tests = ["server"]

[[bin]]
name = "rusty_todos"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "rusty-todos"
path = "src/bin/todos.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "=0.4.38", features = ["serde"] }
tempfile = "=3.10.1"
clap = { version = "=4.5.7", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }
warp = { version = "0.3", optional = true }
sqlx = { version = "0.6.2", features = ["runtime-tokio-rustls", "postgres"], optional = true }
sqlb = { version = "0.0.8", optional = true }

[dev-dependencies]
anyhow = "1"
